name: install-lint-build
on:
  pull_request:
    branches:
      - main
      # The static-rewrite branch (#501) takes PRs of its own, and they need the
      # same lint + build + smoke coverage.
      - redesign/static-rewrite
jobs:
  install_lint_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # FLAG_MARATHON is the only environment variable the site reads. The seven
      # VUE_APP_* Firebase secrets that used to be written here were never read
      # by any code and were dropped in #534.
      - name: Create .env File
        run: |
          touch .env
          echo FLAG_MARATHON=false >> .env

      - name: Install and Build 🔧
        run: |
          npm install
          npm run lint
          npm run build

      - name: Install Playwright Chromium 🎭
        run: npx playwright install --with-deps chromium

      - name: Smoke Test 🧪
        run: npm run test:smoke

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
