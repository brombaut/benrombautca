name: deploy
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["bookshelf-syncer"]
    types:
      - completed
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # FLAG_MARATHON is the only environment variable the site reads. The seven
      # VUE_APP_* Firebase secrets that used to be written here were never read
      # by any code and were dropped in #534.
      - name: Create .env File
        run: |
          touch .env
          echo FLAG_MARATHON=false >> .env

      - name: Install and Build 🔧 # This example project is built using npm and outputs the result to the 'build' folder. Replace with the commands required to build your project, or remove this step entirely if your site is pre-built.
        run: |
          npm install
          npm run lint
          npm run build

      - name: Install Playwright Chromium 🎭
        run: npx playwright install --with-deps chromium

      - name: Smoke Test 🧪
        run: npm run test:smoke

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: dist # The folder the action should deploy.
