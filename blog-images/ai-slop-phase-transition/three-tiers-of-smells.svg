<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1174" viewBox="0 0 1600 1174">
  <defs>
    <marker id="aGrey" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7d8ba3"/></marker>
    <marker id="aGreen" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#2f9e68"/></marker>
    <marker id="aAmber" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#d08a1e"/></marker>
    <marker id="aPurple" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7a5ad0"/></marker>
    <marker id="aTeal" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#109188"/></marker>
    <marker id="aFaint" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#b6c1d2"/></marker>
  </defs>
  <rect width="1600" height="1174" fill="#ffffff"/>
  <rect x="15" y="15" width="1570" height="1144" rx="34" fill="#f8fafc" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="80" y="100" font-family="Noto Sans, sans-serif" font-size="44" font-weight="700" fill="#1f2430" text-anchor="start">Three tiers of AI code quality</text>
  <text x="80" y="148" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#64718a" text-anchor="start">Gray smells are old patterns at new rates, so the tiers overlap rather than nest</text>
  <rect x="553" y="234" width="493" height="750" rx="28" fill="#f1f4fa" stroke="none" stroke-width="0"/>
  <rect x="74" y="214" width="972" height="770" rx="30" fill="none" stroke="#b6c1d2" stroke-width="3" stroke-dasharray="2 0"/>
  <text x="96" y="248" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#64718a" text-anchor="start" letter-spacing="2.2">PREDATES AI</text>
  <rect x="553" y="234" width="972" height="730" rx="30" fill="none" stroke="#7a5ad0" stroke-width="3" stroke-dasharray="2 0"/>
  <text x="1503" y="282" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#7a5ad0" text-anchor="end" letter-spacing="2.2">DISTINCTIVE TO AI OUTPUT</text>
  <text x="799.5" y="980" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#94a3b8" text-anchor="middle">both regions claim this tier</text>
  <rect x="96" y="300" width="449" height="644" rx="20" fill="#ffffff" stroke="#b6c1d2" stroke-width="2.5"/>
  <rect x="116" y="312" width="409" height="8" rx="4" fill="#b6c1d2" stroke="none" stroke-width="3"/>
  <text x="122" y="346" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="2">TIER 1</text>
  <text x="122" y="390" font-family="Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#1f2430" text-anchor="start">Traditional smells</text>
  <text x="122" y="428" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">The same ones we have always had.</text>
  <text x="122" y="456" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">How the code was produced does not</text>
  <text x="122" y="484" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">change what they are.</text>
  <text x="122" y="544" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1.4">WHAT THE TIER IS</text>
  <rect x="122" y="558" width="397" height="44" rx="12" fill="#f4f7fb" stroke="#b6c1d2" stroke-width="2"/>
  <text x="138" y="587" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#8d9ab0" text-anchor="start">old patterns, old detection</text>
  <text x="122" y="644" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">AI-focused tools bundle traditional smell</text>
  <text x="122" y="670" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">detection alongside their AI-specific rules,</text>
  <text x="122" y="696" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">because practitioners found AI makes the</text>
  <text x="122" y="722" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">old problems worse.</text>
  <rect x="575" y="300" width="449" height="644" rx="20" fill="#ffffff" stroke="#d08a1e" stroke-width="2.5"/>
  <rect x="595" y="312" width="409" height="8" rx="4" fill="#d08a1e" stroke="none" stroke-width="3"/>
  <text x="601" y="346" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="2">TIER 2</text>
  <text x="601" y="390" font-family="Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#1f2430" text-anchor="start">Gray smells</text>
  <text x="601" y="428" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">Patterns that predate AI but appear</text>
  <text x="601" y="456" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">disproportionately in AI output.</text>
  <rect x="601" y="494" width="397" height="70" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="799.5" y="525" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#8a5905" text-anchor="middle">109 of 575 rules</text>
  <text x="799.5" y="551" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#64718a" text-anchor="middle">the gray zone, cataloged across 42 tools</text>
  <text x="601" y="604" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1.4">RATE VS HUMAN REFERENCE SOLUTIONS</text>
  <rect x="601" y="618" width="397" height="44" rx="12" fill="#fdf2dd" stroke="#d08a1e" stroke-width="2"/>
  <text x="617" y="647" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#8a5905" text-anchor="start">unused imports</text>
  <text x="982" y="648" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="end">2.8x</text>
  <rect x="601" y="672" width="397" height="44" rx="12" fill="#fdf2dd" stroke="#d08a1e" stroke-width="2"/>
  <text x="617" y="701" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#8a5905" text-anchor="start">broad exception handlers</text>
  <text x="982" y="702" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="end">2.1x</text>
  <text x="601" y="756" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1.4">GRAY RULES, BY TOOLS FLAGGING THEM</text>
  <rect x="601" y="770" width="397" height="44" rx="12" fill="#fdf2dd" stroke="#d08a1e" stroke-width="2"/>
  <text x="617" y="799" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#8a5905" text-anchor="start">swallowed exceptions</text>
  <text x="982" y="800" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="end">18</text>
  <rect x="601" y="824" width="397" height="44" rx="12" fill="#fdf2dd" stroke="#d08a1e" stroke-width="2"/>
  <text x="617" y="853" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#8a5905" text-anchor="start">unused declarations</text>
  <text x="982" y="854" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="end">12</text>
  <rect x="601" y="878" width="397" height="44" rx="12" fill="#fdf2dd" stroke="#d08a1e" stroke-width="2"/>
  <text x="617" y="907" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#8a5905" text-anchor="start">broad / bare except</text>
  <text x="982" y="908" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="end">10</text>
  <rect x="1054" y="300" width="449" height="644" rx="20" fill="#ffffff" stroke="#7a5ad0" stroke-width="2.5"/>
  <rect x="1074" y="312" width="409" height="8" rx="4" fill="#7a5ad0" stroke="none" stroke-width="3"/>
  <text x="1080" y="346" font-family="Noto Sans, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="2">TIER 3</text>
  <text x="1080" y="390" font-family="Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#1f2430" text-anchor="start">AI-specific slop</text>
  <text x="1080" y="428" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">A genuinely new category of defect,</text>
  <text x="1080" y="456" font-family="Noto Sans, sans-serif" font-size="21" font-weight="400" fill="#64718a" text-anchor="start">distinctive to AI.</text>
  <text x="1080" y="516" font-family="Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1.4">WHAT IT LOOKS LIKE</text>
  <rect x="1080" y="530" width="397" height="44" rx="12" fill="#efe9fd" stroke="#7a5ad0" stroke-width="2"/>
  <text x="1096" y="559" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#4b3193" text-anchor="start">narrator comments</text>
  <rect x="1080" y="584" width="397" height="44" rx="12" fill="#efe9fd" stroke="#7a5ad0" stroke-width="2"/>
  <text x="1096" y="613" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#4b3193" text-anchor="start">hallucinated imports</text>
  <rect x="1080" y="638" width="397" height="44" rx="12" fill="#efe9fd" stroke="#7a5ad0" stroke-width="2"/>
  <text x="1096" y="667" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#4b3193" text-anchor="start">cross-language contamination</text>
  <rect x="1080" y="692" width="397" height="44" rx="12" fill="#efe9fd" stroke="#7a5ad0" stroke-width="2"/>
  <text x="1096" y="721" font-family="Noto Sans, sans-serif" font-size="22" font-weight="600" fill="#4b3193" text-anchor="start">fake-done stubs</text>
  <text x="1080" y="778" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">A rate limiter that just returns True is not</text>
  <text x="1080" y="804" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">an incomplete TODO. It is an executable</text>
  <text x="1080" y="830" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">success path, and everything downstream</text>
  <text x="1080" y="856" font-family="Noto Sans, sans-serif" font-size="20" font-weight="400" fill="#64718a" text-anchor="start">behaves as if the limit exists.</text>
  <rect x="74" y="1030" width="1451" height="66" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="2.5"/>
  <text x="799.5" y="1072.72" font-family="Noto Sans, sans-serif" font-size="27" font-weight="700" fill="#8a5905" text-anchor="middle">A useful quality tool cannot only target the new stuff</text>
  <text x="800" y="1136" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="middle">Rates are measured against human-written reference solutions for the same tasks. Tool counts come from a survey of 70+ AI quality tools.</text>
</svg>
