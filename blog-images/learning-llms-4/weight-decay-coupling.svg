<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs><marker id="agrey" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7d8ba3"/></marker><marker id="agreen" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#2f9e68"/></marker><marker id="aamber" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#d08a1e"/></marker><marker id="apurple" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7a5ad0"/></marker><marker id="ateal" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#109188"/></marker><marker id="afaint" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#b6c1d2"/></marker></defs>
  <rect width="1600" height="1040" fill="#ffffff"/>
  <rect x="15" y="15" width="1570" height="1010" rx="34" fill="#f8fafc" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="80" y="100" font-family="Noto Sans, sans-serif" font-size="44" font-weight="700" fill="#1f2430" text-anchor="start">Where weight decay enters the optimizer</text>
  <text x="80" y="148" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#64718a" text-anchor="start">The same decay term, in two places: inside Adam's scaling, or outside it</text>
  <rect x="80" y="200" width="700" height="700" rx="26" fill="#ffffff" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="120" y="252" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="start" letter-spacing="1.8">PLAIN ADAM</text>
  <text x="120" y="297" font-family="Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">Coupled weight decay</text>
  <rect x="120" y="330" width="295" height="78" rx="16" fill="#ddf2f0" stroke="#109188" stroke-width="3"/>
  <text x="267.5" y="377.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#0a5f59" text-anchor="middle">task gradient</text>
  <rect x="445" y="330" width="295" height="78" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="592.5" y="377.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#8a5905" text-anchor="middle">wd x param</text>
  <path d="M267 408 V432 H430 V466" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <path d="M592 408 V432 H430 V466" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="150" y="470" width="560" height="78" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="430.0" y="517.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#8a5905" text-anchor="middle">one combined gradient</text>
  <path d="M430 548 V596" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="150" y="600" width="560" height="88" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="430.0" y="652.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#8a5905" text-anchor="middle">m, v built from the combination</text>
  <path d="M430 688 V736" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="150" y="740" width="560" height="78" rx="16" fill="#eef1f6" stroke="#7d8ba3" stroke-width="3"/>
  <text x="430.0" y="787.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="middle">param - lr x m / sqrt(v)</text>
  <text x="430" y="862" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#64718a" text-anchor="middle">Decay is scaled by Adam's own step sizing.</text>
  <rect x="820" y="200" width="700" height="700" rx="26" fill="#ffffff" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="860" y="252" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="start" letter-spacing="1.8">ADAMW</text>
  <text x="860" y="297" font-family="Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">Decoupled weight decay</text>
  <rect x="860" y="330" width="295" height="78" rx="16" fill="#ddf2f0" stroke="#109188" stroke-width="3"/>
  <text x="1007.5" y="377.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#0a5f59" text-anchor="middle">task gradient</text>
  <rect x="1185" y="330" width="295" height="78" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="1332.5" y="377.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#8a5905" text-anchor="middle">wd x param</text>
  <path d="M1007 408 V466" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="890" y="470" width="560" height="78" rx="16" fill="#e7f6ee" stroke="#2f9e68" stroke-width="3"/>
  <text x="1170.0" y="517.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#1a6b45" text-anchor="middle">m, v built from it alone</text>
  <path d="M1007 548 V596" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="890" y="600" width="560" height="88" rx="16" fill="#eef1f6" stroke="#7d8ba3" stroke-width="3"/>
  <text x="1170.0" y="652.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="middle">param - lr x m / sqrt(v)</text>
  <path d="M1007 688 V736" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <path d="M1332 408 V560" fill="none" stroke="#d08a1e" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12"/>
  <path d="M1332 560 V736" fill="none" stroke="#d08a1e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 12" marker-end="url(#aamber)"/>
  <rect x="890" y="740" width="560" height="78" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="1170.0" y="787.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#8a5905" text-anchor="middle">param - lr x wd x param</text>
  <text x="1170" y="862" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#64718a" text-anchor="middle">Decay is a flat shrink applied after the step.</text>
  <text x="80" y="965" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#64718a" text-anchor="start">Adam's m and v are a confidence estimate built from a handful of early steps, so they are badly calibrated at the start of training.</text>
  <text x="80" y="1000" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#64718a" text-anchor="start">Coupling puts the decay term inside that estimate; decoupling keeps it out of reach of it.</text>
</svg>
