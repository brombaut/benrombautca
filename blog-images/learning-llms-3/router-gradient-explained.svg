  <text x="400.0" y="722.0" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#64718a" text-anchor="middle">a constant</text>
  <path d="M400 732 V768" fill="none" stroke="#b6c1d2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#afaint)"/>
  <rect x="260" y="772" width="280" height="66" rx="16" fill="#eef1f6" stroke="#7d8ba3" stroke-width="3"/>
  <text x="400.0" y="813.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#64718a" text-anchor="middle">expert output</text>
  <path d="M545 805 H660 V733" fill="none" stroke="#b6c1d2" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 9"/>
