  <text x="660" y="632" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="middle">gradient</text>
  <text x="660" y="660" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="middle">stops here</text>
  <text x="400" y="900" font-family="Noto Sans, sans-serif" font-size="26" font-weight="700" fill="#64718a" text-anchor="middle">0.000e+00 largest gradient</text>
  <text x="400" y="932" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#64718a" text-anchor="middle">0 of 128 router entries nonzero</text>
  <rect x="825" y="200" width="705" height="760" rx="26" fill="#ffffff" stroke="#dbe3ef" stroke-width="2.5"/>
