  <text x="865" y="297" font-family="Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">softmax before the selection</text>
  <rect x="1015" y="330" width="280" height="66" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="1155.0" y="371.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#8a5905" text-anchor="middle">router scores</text>
  <path d="M1155 396 V432" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="1015" y="436" width="280" height="72" rx="16" fill="#e7f6ee" stroke="#2f9e68" stroke-width="3"/>
  <text x="1155.0" y="470.0" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#1a6b45" text-anchor="middle">softmax over all 4</text>
  <text x="1155.0" y="498.0" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#64718a" text-anchor="middle">differentiable</text>
  <path d="M1155 508 V544" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="1015" y="548" width="280" height="72" rx="16" fill="#eef1f6" stroke="#7d8ba3" stroke-width="3"/>
  <text x="1155.0" y="582.0" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="middle">top-k picks 1</text>
  <text x="1155.0" y="610.0" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#64718a" text-anchor="middle">of the probabilities</text>
  <path d="M1155 620 V656" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="1015" y="660" width="280" height="72" rx="16" fill="#e7f6ee" stroke="#2f9e68" stroke-width="3"/>
  <text x="1155.0" y="694.0" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#1a6b45" text-anchor="middle">weight varies</text>
  <text x="1155.0" y="722.0" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#64718a" text-anchor="middle">moves with the scores</text>
  <path d="M1155 732 V768" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="1015" y="772" width="280" height="66" rx="16" fill="#eef1f6" stroke="#7d8ba3" stroke-width="3"/>
  <text x="1155.0" y="813.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#64718a" text-anchor="middle">expert output</text>
  <path d="M1300 805 H1330 V363 H1303" fill="none" stroke="#2f9e68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agreen)"/>
  <text x="1356" y="560" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#1a6b45" text-anchor="start">gradient</text>
  <text x="1356" y="588" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#1a6b45" text-anchor="start">reaches</text>
  <text x="1356" y="616" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#1a6b45" text-anchor="start">the router</text>
  <text x="1155" y="900" font-family="Noto Sans, sans-serif" font-size="26" font-weight="700" fill="#1a6b45" text-anchor="middle">2.771e-03 largest gradient</text>
  <text x="1155" y="932" font-family="Noto Sans, sans-serif" font-size="22" font-weight="400" fill="#64718a" text-anchor="middle">128 of 128 router entries nonzero</text>
