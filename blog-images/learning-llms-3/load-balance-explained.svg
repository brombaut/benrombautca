<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><marker id="agrey" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7d8ba3"/></marker><marker id="agreen" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#2f9e68"/></marker><marker id="aamber" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#d08a1e"/></marker><marker id="apurple" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7a5ad0"/></marker><marker id="ateal" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#109188"/></marker><marker id="afaint" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#b6c1d2"/></marker></defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="15" y="15" width="1570" height="970" rx="34" fill="#f8fafc" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="80" y="100" font-family="Noto Sans, sans-serif" font-size="44" font-weight="700" fill="#1f2430" text-anchor="start">The loop that starves an expert</text>
  <text x="80" y="148" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#64718a" text-anchor="start">Nothing in the prediction loss mentions balance, so the router has no reason to interrupt this.</text>
  <rect x="70" y="200" width="705" height="700" rx="26" fill="#ffffff" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="110" y="252" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="start" letter-spacing="1.8">WITHOUT A BALANCE TERM</text>
  <text x="110" y="297" font-family="Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">Each turn makes the next more likely</text>
  <rect x="277" y="360" width="290" height="80" rx="16" fill="#efe9fd" stroke="#7a5ad0" stroke-width="3"/>
  <text x="422.0" y="408.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#4b3193" text-anchor="middle"></text>
  <text x="422" y="408" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#4b3193" text-anchor="middle">more tokens routed to it</text>
  <rect x="477" y="530" width="290" height="80" rx="16" fill="#efe9fd" stroke="#7a5ad0" stroke-width="3"/>
  <text x="622.0" y="578.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#4b3193" text-anchor="middle"></text>
  <text x="622" y="578" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#4b3193" text-anchor="middle">more gradient updates</text>
  <rect x="277" y="700" width="290" height="80" rx="16" fill="#efe9fd" stroke="#7a5ad0" stroke-width="3"/>
  <text x="422.0" y="748.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#4b3193" text-anchor="middle"></text>
  <text x="422" y="748" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#4b3193" text-anchor="middle">it improves faster</text>
  <rect x="77" y="530" width="290" height="80" rx="16" fill="#efe9fd" stroke="#7a5ad0" stroke-width="3"/>
  <text x="222.0" y="578.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#4b3193" text-anchor="middle"></text>
  <text x="222" y="578" font-family="Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#4b3193" text-anchor="middle">the router prefers it</text>
  <path d="M545 430 L600 520" fill="none" stroke="#7a5ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apurple)"/>
  <path d="M600 620 L505 705" fill="none" stroke="#7a5ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apurple)"/>
  <path d="M300 705 L245 625" fill="none" stroke="#7a5ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apurple)"/>
  <path d="M245 515 L300 435" fill="none" stroke="#7a5ad0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apurple)"/>
  <text x="422" y="855" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#64718a" text-anchor="middle">One expert reached 90.6% of tokens. Another fell to 8.3%.</text>
  <rect x="825" y="200" width="705" height="700" rx="26" fill="#ffffff" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="865" y="252" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="start" letter-spacing="1.8">WITH A BALANCE TERM</text>
  <text x="865" y="297" font-family="Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">A second objective the router can see</text>
  <rect x="855" y="336" width="645" height="92" rx="16" fill="#e7f6ee" stroke="#2f9e68" stroke-width="3"/>
  <text x="1177.5" y="390.75" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#1a6b45" text-anchor="middle"></text>
  <text x="1177" y="374" font-family="Noto Sans, sans-serif" font-size="25" font-weight="700" fill="#1a6b45" text-anchor="middle">prediction loss + 0.01 x balance loss</text>
  <text x="1177" y="406" font-family="Noto Sans, sans-serif" font-size="19" font-weight="400" fill="#64718a" text-anchor="middle">counts say where tokens went, probabilities carry the gradient</text>
  <path d="M1177 428 V466" fill="none" stroke="#2f9e68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agreen)"/>
  <text x="1177" y="520" font-family="Noto Sans, sans-serif" font-size="26" font-weight="700" fill="#1f2430" text-anchor="middle">What changed in the second block</text>
  <text x="880" y="585" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#64718a" text-anchor="start">starved expert</text>
  <text x="1285" y="585" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="end">8.3%</text>
  <path d="M1310 577 H1348" fill="none" stroke="#7d8ba3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <text x="1480" y="585" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#1a6b45" text-anchor="end">45.1%</text>
  <text x="880" y="651" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#64718a" text-anchor="start">two dominant experts</text>
  <text x="1285" y="651" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="end">88.0%</text>
  <path d="M1310 643 H1348" fill="none" stroke="#7d8ba3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <text x="1480" y="651" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#1a6b45" text-anchor="end">54.5%</text>
  <text x="880" y="717" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#64718a" text-anchor="start">validation loss</text>
  <text x="1285" y="717" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="end">1.7610</text>
  <path d="M1310 709 H1348" fill="none" stroke="#7d8ba3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <text x="1480" y="717" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#1a6b45" text-anchor="end">1.7467</text>
  <text x="880" y="783" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#64718a" text-anchor="start">runtime</text>
  <text x="1285" y="783" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="end">131.2s</text>
  <path d="M1310 775 H1348" fill="none" stroke="#7d8ba3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <text x="1480" y="783" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="end">133.5s</text>
  <text x="1177" y="862" font-family="Noto Sans, sans-serif" font-size="23" font-weight="400" fill="#64718a" text-anchor="middle">Balance improved and prediction improved with it.</text>
</svg>
