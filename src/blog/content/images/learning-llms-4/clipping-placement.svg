<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810">
  <defs><marker id="agrey" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7d8ba3"/></marker><marker id="agreen" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#2f9e68"/></marker><marker id="aamber" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#d08a1e"/></marker><marker id="apurple" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#7a5ad0"/></marker><marker id="ateal" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#109188"/></marker><marker id="afaint" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0.5 L14,7 L0,13.5 Z" fill="#b6c1d2"/></marker></defs>
  <rect width="1600" height="810" fill="#ffffff"/>
  <rect x="15" y="15" width="1570" height="780" rx="34" fill="#f8fafc" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="80" y="100" font-family="Noto Sans, sans-serif" font-size="44" font-weight="700" fill="#1f2430" text-anchor="start">What the gradient clip actually covered</text>
  <text x="80" y="148" font-family="Noto Sans, sans-serif" font-size="27" font-weight="400" fill="#64718a" text-anchor="start">The cap runs before the optimizer step, and the optimizer step adds more</text>
  <path d="M420 340 V320 H1040 V340" fill="none" stroke="#109188" stroke-width="3.5" stroke-linecap="round"/>
  <text x="730" y="300" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#0a5f59" text-anchor="middle">measured and capped: the task gradient</text>
  <rect x="90" y="380" width="290" height="90" rx="16" fill="#eef1f6" stroke="#7d8ba3" stroke-width="3"/>
  <text x="235.0" y="433.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#64718a" text-anchor="middle">loss.backward()</text>
  <path d="M380 425 H416" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="420" y="380" width="290" height="90" rx="16" fill="#ddf2f0" stroke="#109188" stroke-width="3"/>
  <text x="565.0" y="433.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#0a5f59" text-anchor="middle">log the norm</text>
  <path d="M710 425 H746" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="750" y="380" width="290" height="90" rx="16" fill="#ddf2f0" stroke="#109188" stroke-width="3"/>
  <text x="895.0" y="433.4" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#0a5f59" text-anchor="middle">clip to norm 2.0</text>
  <path d="M1040 425 H1126" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="1130" y="250" width="400" height="330" rx="26" fill="#ffffff" stroke="#dbe3ef" stroke-width="2.5"/>
  <text x="1170" y="302" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#64718a" text-anchor="start" letter-spacing="1.8">PYTORCH INTERNALS</text>
  <text x="1170" y="347" font-family="Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">optimizer.step()</text>
  <rect x="1165" y="380" width="330" height="78" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="1330.0" y="427.05" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="middle">add wd x param</text>
  <path d="M1330 458 V476" fill="none" stroke="#7d8ba3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agrey)"/>
  <rect x="1165" y="478" width="330" height="78" rx="16" fill="#fdf2dd" stroke="#d08a1e" stroke-width="3"/>
  <text x="1330.0" y="525.05" font-family="Noto Sans, sans-serif" font-size="23" font-weight="700" fill="#8a5905" text-anchor="middle">m, v, then update</text>
  <path d="M1130 602 V624 H1530 V602" fill="none" stroke="#d08a1e" stroke-width="3.5" stroke-linecap="round"/>
  <text x="1330" y="672" font-family="Noto Sans, sans-serif" font-size="24" font-weight="700" fill="#8a5905" text-anchor="middle">never capped: the decay term</text>
  <text x="90" y="700" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#64718a" text-anchor="start">So the quantity in the plot and the quantity Adam built its steps from</text>
  <text x="90" y="734" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#64718a" text-anchor="start">were not the same thing. Clipping every raw gradient left the failure</text>
  <text x="90" y="768" font-family="Noto Sans, sans-serif" font-size="24" font-weight="400" fill="#64718a" text-anchor="start">unchanged, and cost the run its best early result.</text>
</svg>
